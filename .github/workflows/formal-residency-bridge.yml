      - "scripts/tests/test_s4_residency_process_coq_certificate.py"
      - "scripts/tests/test_s4_residency_timing_coq_certificate.py"
      - "scripts/tests/test_s4_residency_runner_coq_certificate.py"
      - "scripts/tests/test_s4_residency_evidence_coq_certificate.py"
      - "scripts/tests/test_s4_residency_paired_runner_coq_certificate.py"
      - "scripts/tests/test_s4_register_residency_role.py"
      - "scripts/tests/test_s4_register_residency_role_static.py"
      - "scripts/tests/test_s4_register_residency_host.py"
      - "scripts/tests/test_s4_register_residency_host_static.py"
      - "scripts/tests/test_s4_register_residency_timing.py"
      - "scripts/tests/test_s4_register_residency_timing_static.py"
      - "scripts/tests/test_s4_register_residency_measurement_runner.py"
      - "scripts/tests/test_s4_register_residency_measurement_runner_static.py"
      - "scripts/tests/test_s4_register_residency_evidence*.py"
      - "scripts/tests/test_s4_register_residency_paired_runner*.py"
      - ".github/workflows/formal-residency-bridge.yml"
  pull_request:
    paths:
      - "naux-meta-coq/**"
      - "naux-lang/examples/naux_s4_register_residency_plan.rs"
      - "naux-lang/examples/support/s4_register_residency_plan.rs"
      - "naux-lang/examples/naux_s4_register_residency_encoding.rs"
      - "naux-lang/examples/support/s4_register_residency_encoding.rs"
      - "naux-lang/examples/naux_s4_register_residency_elf.rs"
      - "naux-lang/examples/support/s4_register_residency_elf.rs"
      - "naux-lang/examples/naux_s4_register_residency_process.rs"
      - "naux-lang/examples/support/s4_register_residency_process.rs"
      - "naux-lang/examples/naux_s4_register_residency_timing.rs"
      - "naux-lang/examples/support/s4_register_residency_timing_elf.rs"
      - "distribution/s4-performance/WP8B-*.tsv"
      - "distribution/s4-performance/WP8C-*.tsv"
      - "distribution/s4-performance/WP8D-*.tsv"
      - "distribution/s4-performance/WP8E-*.tsv"
      - "distribution/s4-performance/WP8F-*.tsv"
      - "distribution/s4-performance/WP8G-*"
      - "distribution/s4-performance/WP8H-*"
      - "distribution/s4-performance/WP8I-*"
      - "distribution/s4-performance/WP8J-*"
      - "distribution/s4-performance/WP8K-*"
      - "distribution/s4-performance/WP8L-*"
      - "distribution/s4-performance/WP8M-*"
      - "scripts/s4_register_residency_contract.py"
      - "scripts/s4_register_residency_plan_authority.py"
      - "scripts/s4_register_residency_encoding_contract.py"
      - "scripts/s4_register_residency_candidate_authority.py"
      - "scripts/s4_register_residency_elf_authority.py"
      - "scripts/s4_register_residency_process.py"
      - "scripts/s4_register_residency_role.py"
      - "scripts/s4_register_residency_host.py"
      - "scripts/s4_register_residency_timing.py"
      - "scripts/s4_register_residency_measurement_runner.py"
      - "scripts/s4_register_residency_evidence.py"
      - "scripts/s4_register_residency_paired_runner.py"
      - "scripts/s4_residency_coq_certificate.py"
      - "scripts/s4_residency_x86_coq_certificate.py"
      - "scripts/s4_residency_elf_coq_certificate.py"
      - "scripts/s4_residency_process_coq_certificate.py"
      - "scripts/s4_residency_timing_coq_certificate.py"
      - "scripts/s4_residency_runner_coq_certificate.py"
      - "scripts/s4_residency_evidence_coq_certificate.py"
      - "scripts/s4_residency_paired_runner_coq_certificate.py"
      - "scripts/tests/test_s4_residency_coq_certificate.py"
      - "scripts/tests/test_s4_residency_x86_coq_certificate.py"
      - "scripts/tests/test_s4_residency_elf_coq_certificate.py"
      - "scripts/tests/test_s4_residency_process_coq_certificate.py"
      - "scripts/tests/test_s4_residency_timing_coq_certificate.py"
      - "scripts/tests/test_s4_residency_runner_coq_certificate.py"
      - "scripts/tests/test_s4_residency_evidence_coq_certificate.py"
      - "scripts/tests/test_s4_residency_paired_runner_coq_certificate.py"
      - "scripts/tests/test_s4_register_residency_role.py"
      - "scripts/tests/test_s4_register_residency_role_static.py"
      - "scripts/tests/test_s4_register_residency_host.py"
      - "scripts/tests/test_s4_register_residency_host_static.py"
      - "scripts/tests/test_s4_register_residency_timing.py"
      - "scripts/tests/test_s4_register_residency_timing_static.py"
      - "scripts/tests/test_s4_register_residency_measurement_runner.py"
      - "scripts/tests/test_s4_register_residency_measurement_runner_static.py"
      - "scripts/tests/test_s4_register_residency_evidence*.py"
      - "scripts/tests/test_s4_register_residency_paired_runner*.py"
      - ".github/workflows/formal-residency-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admitted-report-to-rocq:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Emit and authenticate the WP8C through WP8M reports
        run: |
          cargo build --locked -p naux \
            --example naux_s4_register_residency_plan \
            --example naux_s4_register_residency_encoding \
            --example naux_s4_register_residency_elf \
            --example naux_s4_register_residency_process \
            --example naux_s4_register_residency_timing
          target/debug/examples/naux_s4_register_residency_plan > "$RUNNER_TEMP/wp8c-plan.tsv"
          target/debug/examples/naux_s4_register_residency_encoding > "$RUNNER_TEMP/wp8e-encoding.tsv"
          target/debug/examples/naux_s4_register_residency_elf > "$RUNNER_TEMP/wp8f-elf.tsv"
          target/debug/examples/naux_s4_register_residency_process > "$RUNNER_TEMP/wp8g-process.tsv"
          target/debug/examples/naux_s4_register_residency_timing > "$RUNNER_TEMP/wp8j-candidate.tsv"
          python3 scripts/s4_register_residency_plan_authority.py \
            --report "$RUNNER_TEMP/wp8c-plan.tsv"
          python3 scripts/s4_register_residency_candidate_authority.py \
            --report "$RUNNER_TEMP/wp8e-encoding.tsv"
          python3 scripts/s4_register_residency_elf_authority.py \
            --report "$RUNNER_TEMP/wp8f-elf.tsv"
          python3 scripts/s4_register_residency_process.py
          python3 scripts/s4_register_residency_process.py \
            --binary target/debug/examples/naux_s4_register_residency_process \
            > "$RUNNER_TEMP/wp8g-replay.tsv"
          python3 scripts/s4_register_residency_role.py \
            --binary target/debug/examples/naux_s4_register_residency_process \
            > "$RUNNER_TEMP/wp8h-role.tsv"
          python3 scripts/s4_register_residency_host.py \
            > "$RUNNER_TEMP/wp8i-host.tsv"
          python3 scripts/s4_register_residency_timing.py
          python3 scripts/s4_register_residency_timing.py \
            --binary target/debug/examples/naux_s4_register_residency_timing \
            > "$RUNNER_TEMP/wp8j-replay.tsv"
          python3 scripts/s4_register_residency_measurement_runner.py \
            > "$RUNNER_TEMP/wp8k-runner.tsv"
          python3 scripts/s4_register_residency_evidence.py \
            > "$RUNNER_TEMP/wp8l-evidence.tsv"
          python3 scripts/s4_register_residency_paired_runner.py \
            > "$RUNNER_TEMP/wp8m-paired-runner.tsv"
      - name: Generate the untrusted Rocq certificates
        run: |
          python3 -m py_compile scripts/s4_residency_coq_certificate.py
          python3 -m py_compile scripts/s4_residency_x86_coq_certificate.py
          python3 -m py_compile scripts/s4_residency_elf_coq_certificate.py
          python3 -m py_compile scripts/s4_residency_process_coq_certificate.py
          python3 -m py_compile scripts/s4_residency_timing_coq_certificate.py
          python3 -m py_compile scripts/s4_residency_runner_coq_certificate.py
          python3 -m py_compile scripts/s4_residency_evidence_coq_certificate.py
          python3 -m py_compile scripts/s4_residency_paired_runner_coq_certificate.py
          python3 -m unittest -v \
            scripts.tests.test_s4_residency_coq_certificate \
            scripts.tests.test_s4_residency_x86_coq_certificate \
            scripts.tests.test_s4_residency_elf_coq_certificate \
            scripts.tests.test_s4_residency_process_coq_certificate \
            scripts.tests.test_s4_residency_timing_coq_certificate \
            scripts.tests.test_s4_residency_runner_coq_certificate \
            scripts.tests.test_s4_residency_evidence_coq_certificate \
            scripts.tests.test_s4_residency_paired_runner_coq_certificate \
            scripts.tests.test_s4_register_residency_role_static \
            scripts.tests.test_s4_register_residency_role \
            scripts.tests.test_s4_register_residency_host_static \
            scripts.tests.test_s4_register_residency_host \
            scripts.tests.test_s4_register_residency_timing_static \
            scripts.tests.test_s4_register_residency_timing \
            scripts.tests.test_s4_register_residency_measurement_runner \
            scripts.tests.test_s4_register_residency_measurement_runner_static \
            scripts.tests.test_s4_register_residency_evidence_replay \
            scripts.tests.test_s4_register_residency_evidence_static \
            scripts.tests.test_s4_register_residency_paired_runner \
            scripts.tests.test_s4_register_residency_paired_runner_static
          python3 scripts/s4_residency_coq_certificate.py \
            --report "$RUNNER_TEMP/wp8c-plan.tsv" \
            --output "$RUNNER_TEMP/wp8c-certificates-a.v"
          python3 scripts/s4_residency_coq_certificate.py \
            --report "$RUNNER_TEMP/wp8c-plan.tsv" \
            --output "$RUNNER_TEMP/wp8c-certificates-b.v"
          cmp "$RUNNER_TEMP/wp8c-certificates-a.v" \
            "$RUNNER_TEMP/wp8c-certificates-b.v"
          cp "$RUNNER_TEMP/wp8c-certificates-a.v" \
            naux-meta-coq/GeneratedWP8CCertificates.v
          python3 scripts/s4_residency_x86_coq_certificate.py \
            --plan-report "$RUNNER_TEMP/wp8c-plan.tsv" \
            --encoding-report "$RUNNER_TEMP/wp8e-encoding.tsv" \
            --output "$RUNNER_TEMP/wp8e-x86-certificates-a.v"
          python3 scripts/s4_residency_x86_coq_certificate.py \
            --plan-report "$RUNNER_TEMP/wp8c-plan.tsv" \
            --encoding-report "$RUNNER_TEMP/wp8e-encoding.tsv" \
            --output "$RUNNER_TEMP/wp8e-x86-certificates-b.v"
          cmp "$RUNNER_TEMP/wp8e-x86-certificates-a.v" \
            "$RUNNER_TEMP/wp8e-x86-certificates-b.v"
          cp "$RUNNER_TEMP/wp8e-x86-certificates-a.v" \
            naux-meta-coq/GeneratedWP8EX86Certificates.v
          for kernel in 01 02 03 04; do
            module="GeneratedWP8FELFKernel${kernel}"
            python3 scripts/s4_residency_elf_coq_certificate.py \
              --plan-report "$RUNNER_TEMP/wp8c-plan.tsv" \
              --encoding-report "$RUNNER_TEMP/wp8e-encoding.tsv" \
              --elf-report "$RUNNER_TEMP/wp8f-elf.tsv" \
              --kernel "$kernel" \
              --output "$RUNNER_TEMP/${module}-a.v"
            python3 scripts/s4_residency_elf_coq_certificate.py \
              --plan-report "$RUNNER_TEMP/wp8c-plan.tsv" \
              --encoding-report "$RUNNER_TEMP/wp8e-encoding.tsv" \
              --elf-report "$RUNNER_TEMP/wp8f-elf.tsv" \
              --kernel "$kernel" \
              --output "$RUNNER_TEMP/${module}-b.v"
            cmp "$RUNNER_TEMP/${module}-a.v" \
              "$RUNNER_TEMP/${module}-b.v"
            cp "$RUNNER_TEMP/${module}-a.v" "naux-meta-coq/${module}.v"
          done
          for kernel in 01 02 03 04; do
            module="GeneratedWP8GProcessKernel${kernel}"
            python3 scripts/s4_residency_process_coq_certificate.py \
              --plan-report "$RUNNER_TEMP/wp8c-plan.tsv" \
              --encoding-report "$RUNNER_TEMP/wp8e-encoding.tsv" \
              --process-report "$RUNNER_TEMP/wp8g-process.tsv" \
              --replay-report "$RUNNER_TEMP/wp8g-replay.tsv" \
              --role-report "$RUNNER_TEMP/wp8h-role.tsv" \
              --host-report "$RUNNER_TEMP/wp8i-host.tsv" \
              --kernel "$kernel" \
              --output "$RUNNER_TEMP/${module}-a.v"
            python3 scripts/s4_residency_process_coq_certificate.py \
              --plan-report "$RUNNER_TEMP/wp8c-plan.tsv" \
              --encoding-report "$RUNNER_TEMP/wp8e-encoding.tsv" \
              --process-report "$RUNNER_TEMP/wp8g-process.tsv" \
              --replay-report "$RUNNER_TEMP/wp8g-replay.tsv" \
              --role-report "$RUNNER_TEMP/wp8h-role.tsv" \
              --host-report "$RUNNER_TEMP/wp8i-host.tsv" \
              --kernel "$kernel" \
              --output "$RUNNER_TEMP/${module}-b.v"
            cmp "$RUNNER_TEMP/${module}-a.v" \
              "$RUNNER_TEMP/${module}-b.v"
            cp "$RUNNER_TEMP/${module}-a.v" "naux-meta-coq/${module}.v"
          done
          for kernel in 01 02 03 04; do
            module="GeneratedWP8JTimingKernel${kernel}"
            python3 scripts/s4_residency_timing_coq_certificate.py \
              --process-report "$RUNNER_TEMP/wp8g-process.tsv" \
              --host-report "$RUNNER_TEMP/wp8i-host.tsv" \
              --timing-candidate "$RUNNER_TEMP/wp8j-candidate.tsv" \
              --timing-report "$RUNNER_TEMP/wp8j-replay.tsv" \
              --kernel "$kernel" \
              --output "$RUNNER_TEMP/${module}-a.v"
            python3 scripts/s4_residency_timing_coq_certificate.py \
              --process-report "$RUNNER_TEMP/wp8g-process.tsv" \
              --host-report "$RUNNER_TEMP/wp8i-host.tsv" \
              --timing-candidate "$RUNNER_TEMP/wp8j-candidate.tsv" \
              --timing-report "$RUNNER_TEMP/wp8j-replay.tsv" \
              --kernel "$kernel" \
              --output "$RUNNER_TEMP/${module}-b.v"
            cmp "$RUNNER_TEMP/${module}-a.v" \
              "$RUNNER_TEMP/${module}-b.v"
            cp "$RUNNER_TEMP/${module}-a.v" "naux-meta-coq/${module}.v"
          done
          python3 scripts/s4_residency_runner_coq_certificate.py \
            --runner-report "$RUNNER_TEMP/wp8k-runner.tsv" \
            --output "$RUNNER_TEMP/GeneratedWP8KRunner-a.v"
          python3 scripts/s4_residency_runner_coq_certificate.py \
            --runner-report "$RUNNER_TEMP/wp8k-runner.tsv" \
            --output "$RUNNER_TEMP/GeneratedWP8KRunner-b.v"
          cmp "$RUNNER_TEMP/GeneratedWP8KRunner-a.v" \
            "$RUNNER_TEMP/GeneratedWP8KRunner-b.v"
          cp "$RUNNER_TEMP/GeneratedWP8KRunner-a.v" \
            naux-meta-coq/GeneratedWP8KRunner.v
          python3 scripts/s4_residency_evidence_coq_certificate.py \
            --evidence-report "$RUNNER_TEMP/wp8l-evidence.tsv" \
            --output "$RUNNER_TEMP/GeneratedWP8LEvidence-a.v"
          python3 scripts/s4_residency_evidence_coq_certificate.py \
            --evidence-report "$RUNNER_TEMP/wp8l-evidence.tsv" \
            --output "$RUNNER_TEMP/GeneratedWP8LEvidence-b.v"
          cmp "$RUNNER_TEMP/GeneratedWP8LEvidence-a.v" \
            "$RUNNER_TEMP/GeneratedWP8LEvidence-b.v"
          cp "$RUNNER_TEMP/GeneratedWP8LEvidence-a.v" \
            naux-meta-coq/GeneratedWP8LEvidence.v
          python3 scripts/s4_residency_paired_runner_coq_certificate.py \
            --paired-report "$RUNNER_TEMP/wp8m-paired-runner.tsv" \
            --output "$RUNNER_TEMP/GeneratedWP8MPairedRunner-a.v"
          python3 scripts/s4_residency_paired_runner_coq_certificate.py \
            --paired-report "$RUNNER_TEMP/wp8m-paired-runner.tsv" \
            --output "$RUNNER_TEMP/GeneratedWP8MPairedRunner-b.v"
          cmp "$RUNNER_TEMP/GeneratedWP8MPairedRunner-a.v" \
            "$RUNNER_TEMP/GeneratedWP8MPairedRunner-b.v"
          cp "$RUNNER_TEMP/GeneratedWP8MPairedRunner-a.v" \
            naux-meta-coq/GeneratedWP8MPairedRunner.v
      - name: Admit the report inside Rocq 9.1
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58 # v1.5.2
        with:
          custom_image: rocq/rocq-prover:9.1
          custom_script: |
            set -eo pipefail
            eval "$(opam env)"
            sudo chown -R "$(id -u):$(id -g)" .

            make -C naux-meta-coq clean all
            rocq c -Q naux-meta-coq NauxCore \
              naux-meta-coq/GeneratedWP8CCertificates.v
            rocq c -Q naux-meta-coq NauxCore \
              naux-meta-coq/GeneratedWP8EX86Certificates.v
            for kernel in 01 02 03 04; do
              rocq c -Q naux-meta-coq NauxCore \
                "naux-meta-coq/GeneratedWP8FELFKernel${kernel}.v"
              rocq c -Q naux-meta-coq NauxCore \
                "naux-meta-coq/GeneratedWP8GProcessKernel${kernel}.v"
              rocq c -Q naux-meta-coq NauxCore \
                "naux-meta-coq/GeneratedWP8JTimingKernel${kernel}.v"
            done
            rocq c -Q naux-meta-coq NauxCore \
              naux-meta-coq/GeneratedWP8KRunner.v
            rocq c -Q naux-meta-coq NauxCore \
              naux-meta-coq/GeneratedWP8LEvidence.v
            rocq c -Q naux-meta-coq NauxCore \
              naux-meta-coq/GeneratedWP8MPairedRunner.v
            rocq check -silent -o -Q naux-meta-coq NauxCore \
                NauxCore.GeneratedWP8CCertificates \
                NauxCore.GeneratedWP8EX86Certificates 2>&1 \
              | tee /tmp/naux-wp8c-coqchk-context.txt
            grep -Fq '* Axioms: <none>' /tmp/naux-wp8c-coqchk-context.txt
            for kernel in 01 02 03 04; do
              rocq check -silent -o -Q naux-meta-coq NauxCore \
                  "NauxCore.GeneratedWP8FELFKernel${kernel}" 2>&1 \
                | tee "/tmp/naux-wp8f-kernel-${kernel}-coqchk-context.txt"
              grep -Fq '* Axioms: <none>' \
                "/tmp/naux-wp8f-kernel-${kernel}-coqchk-context.txt"
              rocq check -silent -o -Q naux-meta-coq NauxCore \
                  "NauxCore.GeneratedWP8GProcessKernel${kernel}" 2>&1 \
                | tee "/tmp/naux-wp8g-kernel-${kernel}-coqchk-context.txt"
              grep -Fq '* Axioms: <none>' \
                "/tmp/naux-wp8g-kernel-${kernel}-coqchk-context.txt"
              rocq check -silent -o -Q naux-meta-coq NauxCore \
                  "NauxCore.GeneratedWP8JTimingKernel${kernel}" 2>&1 \
                | tee "/tmp/naux-wp8j-kernel-${kernel}-coqchk-context.txt"
              grep -Fq '* Axioms: <none>' \
                "/tmp/naux-wp8j-kernel-${kernel}-coqchk-context.txt"
            done
            rocq check -silent -o -Q naux-meta-coq NauxCore \
                NauxCore.GeneratedWP8KRunner 2>&1 \
              | tee /tmp/naux-wp8k-runner-coqchk-context.txt
            grep -Fq '* Axioms: <none>' \
              /tmp/naux-wp8k-runner-coqchk-context.txt
            rocq check -silent -o -Q naux-meta-coq NauxCore \
                NauxCore.GeneratedWP8LEvidence 2>&1 \
              | tee /tmp/naux-wp8l-evidence-coqchk-context.txt
            grep -Fq '* Axioms: <none>' \
              /tmp/naux-wp8l-evidence-coqchk-context.txt
            rocq check -silent -o -Q naux-meta-coq NauxCore \
                NauxCore.GeneratedWP8MPairedRunner 2>&1 \
              | tee /tmp/naux-wp8m-paired-runner-coqchk-context.txt
            grep -Fq '* Axioms: <none>' \
              /tmp/naux-wp8m-paired-runner-coqchk-context.txt
            if grep -n -E '\b(Admitted|admit|Axiom|Parameter)\b' \
              naux-meta-coq/GeneratedWP8CCertificates.v \
              naux-meta-coq/GeneratedWP8EX86Certificates.v \
              naux-meta-coq/GeneratedWP8FELFKernel*.v \
              naux-meta-coq/GeneratedWP8GProcessKernel*.v \
              naux-meta-coq/GeneratedWP8JTimingKernel*.v \
              naux-meta-coq/GeneratedWP8KRunner.v \
              naux-meta-coq/GeneratedWP8LEvidence.v \
              naux-meta-coq/GeneratedWP8MPairedRunner.v; then
              echo "Unchecked generated declaration found" >&2
              exit 1
            fi
            make -C naux-meta-coq clean
            rm -f naux-meta-coq/GeneratedWP8CCertificates.v \
              naux-meta-coq/GeneratedWP8EX86Certificates.v \
              naux-meta-coq/GeneratedWP8FELFKernel*.v \
              naux-meta-coq/GeneratedWP8GProcessKernel*.v \
              naux-meta-coq/GeneratedWP8JTimingKernel*.v \
              naux-meta-coq/GeneratedWP8KRunner.v \
              naux-meta-coq/GeneratedWP8LEvidence.v \
              naux-meta-coq/GeneratedWP8MPairedRunner.v
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
