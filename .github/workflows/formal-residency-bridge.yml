      - "distribution/s4-performance/WP8K-*"
      - "distribution/s4-performance/WP8L-*"
      - "distribution/s4-performance/WP8M-*"
      - "scripts/s4_register_residency_contract.py"
      - "scripts/s4_register_residency_plan_authority.py"
