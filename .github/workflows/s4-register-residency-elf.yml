name: S4 register-residency ELF64 quarantine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  elf-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup component add --toolchain 1.96.0 rustfmt clippy
          rustup default 1.96.0
      - name: Validate repository authorities
        run: python3 scripts/license_transition.py
      - name: Validate WP8D encoding contract
        run: python3 scripts/s4_register_residency_encoding_contract.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint quarantined ELF emitter
        run: cargo clippy --locked -p naux --example naux_s4_register_residency_elf -- -D warnings
      - name: Build quarantined ELF emitter
        run: cargo build --locked -p naux --example naux_s4_register_residency_elf
      - name: Emit twice and require byte identity
        run: |
          target/debug/examples/naux_s4_register_residency_elf > "$RUNNER_TEMP/wp8f-a.tsv"
          target/debug/examples/naux_s4_register_residency_elf > "$RUNNER_TEMP/wp8f-b.tsv"
          cmp "$RUNNER_TEMP/wp8f-a.tsv" "$RUNNER_TEMP/wp8f-b.tsv"
      - name: Verify quarantined ELF authority
        run: python3 scripts/s4_register_residency_elf_authority.py --report "$RUNNER_TEMP/wp8f-a.tsv"
      - name: Run fail-closed authority tests
        env:
          NAUX_S4_WP8F_REPORT: ${{ runner.temp }}/wp8f-a.tsv
        run: python3 -m unittest -v scripts.tests.test_s4_register_residency_elf_authority
      - name: Run focused Rust ELF tests
        run: cargo test --locked -p naux --example naux_s4_register_residency_elf
      - name: Reject whitespace damage
        run: git diff --check
