name: S4 performance claim admission authority

on:
  push:
    paths:
      - ".github/workflows/s4-claim-admission.yml"
      - "distribution/s4-performance/**"
      - "scripts/s4_*.py"
      - "scripts/tests/test_s4_*.py"
  pull_request:
    paths:
      - ".github/workflows/s4-claim-admission.yml"
      - "distribution/s4-performance/**"
      - "scripts/s4_*.py"
      - "scripts/tests/test_s4_*.py"

permissions:
  contents: read

jobs:
  static-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static claim admission authority
        run: python3 scripts/s4_claim_admission.py
      - name: Focused refusal tests
        run: python3 -m unittest scripts.tests.test_s4_claim_admission_static scripts.tests.test_s4_claim_admission_refusal
