name: S4 exact register-residency claim admission

on:
  push:
    paths:
      - ".github/workflows/s4-*.yml"
      - "distribution/s4-performance/**"
      - "distribution/license-transition/**"
      - "scripts/s4_*.py"
      - "scripts/license_transition.py"
      - "scripts/tests/test_s4_*.py"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/s4-*.yml"
      - "distribution/s4-performance/**"
      - "distribution/license-transition/**"
      - "scripts/s4_*.py"
      - "scripts/license_transition.py"
      - "scripts/tests/test_s4_*.py"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate fixed approval boundary
        run: python3 scripts/s4_register_residency_exact_claim.py
      - name: Run fail-closed WP8S tests
        run: |
          python3 -m unittest \
            scripts.tests.test_s4_register_residency_exact_claim_static \
            scripts.tests.test_s4_register_residency_exact_claim_replay
      - name: Verify public owner-approval record
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_API: https://api.github.com/repos/x2t8/Naux/releases/tags/s4-wp8m-56b6447
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output "$RUNNER_TEMP/release.json" "$RELEASE_API"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import hashlib
          import json
          import sys

          with open(sys.argv[1], "rb") as handle:
              release = json.load(handle)
          expected = (
              release["id"] == 382979878,
              release["draft"] is False,
              release["html_url"] == "https://github.com/x2t8/Naux/releases/tag/s4-wp8m-56b6447",
              release["tag_name"] == "s4-wp8m-56b6447",
              release["author"]["login"] == "x2t8",
              release["updated_at"] == "2026-09-05T06:31:18Z",
              hashlib.sha256(release["body"].encode()).hexdigest()
              == "d4127d9b3870765e04dc8ea22ea66d6344d4c24b05e26162db30e68430cf59f6",
          )
          assets = {item["id"]: item for item in release["assets"]}
          archive = assets[544820377]
          receipt = assets[544820376]
          expected += (
              archive["size"] == 11699,
              archive["digest"] == "sha256:c94dd7bb8743f2a740227e57b75a51e56b0ff309492f2277628a297de0cfee69",
              receipt["size"] == 956,
              receipt["digest"] == "sha256:6441d7effac7f21a692ff28ee0504473c90f7cd77a2d8d599888e69c33d45d81",
          )
          if not all(expected):
              raise SystemExit("public release approval identity drifted")
          PY
          git ls-remote --exit-code https://github.com/x2t8/Naux.git \
            refs/tags/s4-wp8m-56b6447 \
            | grep -Fx $'56b6447a13ac648c8e35e64daa34ddabb7e0b51c\trefs/tags/s4-wp8m-56b6447'
      - name: Download pinned public evidence
        env:
          RELEASE_BASE: https://github.com/x2t8/Naux/releases/download/s4-wp8m-56b6447
          ARCHIVE: naux-s4-register-residency-paired-56b6447a13ac648c8e35e64daa34ddabb7e0b51c.tar.gz
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 \
            --output "$RUNNER_TEMP/$ARCHIVE" "$RELEASE_BASE/$ARCHIVE"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 \
            --output "$RUNNER_TEMP/$ARCHIVE.receipt.tsv" \
            "$RELEASE_BASE/$ARCHIVE.receipt.tsv"
          cd "$RUNNER_TEMP"
          echo 'c94dd7bb8743f2a740227e57b75a51e56b0ff309492f2277628a297de0cfee69  naux-s4-register-residency-paired-56b6447a13ac648c8e35e64daa34ddabb7e0b51c.tar.gz' | sha256sum --check --strict
          echo '6441d7effac7f21a692ff28ee0504473c90f7cd77a2d8d599888e69c33d45d81  naux-s4-register-residency-paired-56b6447a13ac648c8e35e64daa34ddabb7e0b51c.tar.gz.receipt.tsv' | sha256sum --check --strict
      - name: Admit only the exact approved observation
        env:
          ARCHIVE: naux-s4-register-residency-paired-56b6447a13ac648c8e35e64daa34ddabb7e0b51c.tar.gz
        run: |
          python3 scripts/s4_register_residency_exact_claim.py \
            --archive "$RUNNER_TEMP/$ARCHIVE" \
            --receipt "$RUNNER_TEMP/$ARCHIVE.receipt.tsv" \
            | tee "$RUNNER_TEMP/wp8s-admission.tsv"
          grep -Fx 'passing-kernels	4' "$RUNNER_TEMP/wp8s-admission.tsv"
          grep -Fx 'claim-status	admitted-exact-observation' "$RUNNER_TEMP/wp8s-admission.tsv"
