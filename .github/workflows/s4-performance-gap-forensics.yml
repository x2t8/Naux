name: S4 performance-gap forensics authority

on:
  push:
    paths:
      - ".github/workflows/s4-performance-gap-forensics.yml"
      - "distribution/s4-performance/**"
      - "naux-lang/examples/naux_s4_residual_elf64.rs"
      - "naux-lang/examples/support/s4_residual_*.rs"
      - "scripts/s4_*.py"
      - "scripts/tests/test_s4_*.py"
  pull_request:
    paths:
      - ".github/workflows/s4-performance-gap-forensics.yml"
      - "distribution/s4-performance/**"
      - "naux-lang/examples/naux_s4_residual_elf64.rs"
      - "naux-lang/examples/support/s4_residual_*.rs"
      - "scripts/s4_*.py"
      - "scripts/tests/test_s4_*.py"

permissions:
  contents: read

jobs:
  static-and-clock-free-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Materialize the sealed pre-Apache authority view
        run: python3 scripts/license_transition.py --materialize-historical /tmp/naux-pre-apache
      - name: Build reviewed WP5D emitter
        run: cargo build --locked -p naux --example naux_s4_residual_elf64
      - name: Static WP8A authority
        run: python3 /tmp/naux-pre-apache/scripts/s4_performance_gap_forensics.py --root /tmp/naux-pre-apache
      - name: Focused clock-free replay tests
        env:
          NAUX_S4_WP5D_EMITTER: ${{ github.workspace }}/target/debug/examples/naux_s4_residual_elf64
        run: cd /tmp/naux-pre-apache && python3 -m unittest scripts.tests.test_s4_performance_gap_forensics_static scripts.tests.test_s4_performance_gap_forensics_replay
