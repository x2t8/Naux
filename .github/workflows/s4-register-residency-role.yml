name: S4 register-residency candidate role

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  untimed-candidate-role:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup component add --toolchain 1.96.0 rustfmt clippy
          rustup default 1.96.0
      - name: Validate repository authorities
        run: python3 scripts/license_transition.py
      - name: Test and build reviewed WP8G emitter
        run: |
          cargo test --locked -p naux --example naux_s4_register_residency_process
          cargo build --locked -p naux --example naux_s4_register_residency_process
      - name: Validate static and fresh-process role composition
        run: |
          python3 scripts/s4_register_residency_role.py
          python3 scripts/s4_register_residency_role.py \
            --binary target/debug/examples/naux_s4_register_residency_process
      - name: Run static fail-closed tests
        run: python3 -m unittest -v scripts.tests.test_s4_register_residency_role_static
      - name: Run replay fail-closed tests
        env:
          NAUX_S4_WP8H_BINARY: ${{ github.workspace }}/target/debug/examples/naux_s4_register_residency_process
        run: python3 -m unittest -v scripts.tests.test_s4_register_residency_role
      - name: Check formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p naux --example naux_s4_register_residency_process -- -D warnings
          git diff --check
