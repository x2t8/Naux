name: S4 register-residency paired evidence

on:
  push:
    paths:
      - ".github/workflows/s4-register-residency-paired-evidence.yml"
      - "distribution/s4-performance/WP8N-*"
      - "scripts/s4_register_residency_paired_evidence.py"
      - "scripts/tests/test_s4_register_residency_paired_evidence*.py"
  pull_request:
    paths:
      - ".github/workflows/s4-register-residency-paired-evidence.yml"
      - "distribution/s4-performance/WP8N-*"
      - "scripts/s4_register_residency_paired_evidence.py"
      - "scripts/tests/test_s4_register_residency_paired_evidence*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static paired-evidence authority
        run: python3 scripts/s4_register_residency_paired_evidence.py
      - name: Test read-only replay and refusal paths
        run: |
          python3 -m unittest \
            scripts.tests.test_s4_register_residency_paired_evidence_replay \
            scripts.tests.test_s4_register_residency_paired_evidence_static
