name: S4 register-residency fresh-process parity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  process-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup component add --toolchain 1.96.0 rustfmt clippy
          rustup default 1.96.0
      - name: Validate repository authorities
        run: python3 scripts/license_transition.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint process emitter
        run: cargo clippy --locked -p naux --example naux_s4_register_residency_process -- -D warnings
      - name: Build process emitter
        run: cargo build --locked -p naux --example naux_s4_register_residency_process
      - name: Replay fresh-process parity
        run: |
          python3 scripts/s4_register_residency_process.py \
            --binary target/debug/examples/naux_s4_register_residency_process
      - name: Run fail-closed replay tests
        env:
          NAUX_S4_WP8G_BINARY: ${{ github.workspace }}/target/debug/examples/naux_s4_register_residency_process
        run: python3 -m unittest -v scripts.tests.test_s4_register_residency_process
      - name: Run focused Rust process tests
        run: cargo test --locked -p naux --example naux_s4_register_residency_process
      - name: Reject whitespace damage
        run: git diff --check
