name: Formal model

on:
  push:
    paths:
      - "naux-meta-coq/**"
      - ".github/workflows/formal-model.yml"
  pull_request:
    paths:
      - "naux-meta-coq/**"
      - ".github/workflows/formal-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rocq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check proofs with Rocq 9.1
        uses: rocq-prover/docker-opam-action@126d4ac196f8133729a1cb0d2aa1ee7106efec58 # v1.5.2
        with:
          custom_image: rocq/rocq-prover:9.1
          custom_script: |
            # docker-opam-action's group helpers read an optional shell
            # variable before assigning it, so nounset aborts before Rocq can
            # run. Keep errexit and pipefail for the proof gates themselves.
            set -eo pipefail
            # The official image normally exposes Rocq through its
            # `opam exec --` entrypoint. docker-opam-action replaces that
            # entrypoint for custom scripts, so restore the switch explicitly.
            eval "$(opam env)"
            sudo chown -R "$(id -u):$(id -g)" .

            startGroup "Build formal model"
              rocq --version
              make -C naux-meta-coq clean all
            endGroup

            startGroup "Replay proof objects in the kernel"
              rocq check -silent -o -Q naux-meta-coq NauxCore \
                  NauxCore.NauxCore \
                  NauxCore.Soundness \
                  NauxCore.RegisterResidency \
                  NauxCore.DefiniteInitialization \
                  NauxCore.ProjectedCFGResidency \
                  NauxCore.ScalarMachineIRResidency \
                  NauxCore.HeapMachineIRResidency \
                  NauxCore.OwnershipMachineIRResidency 2>&1 \
                | tee /tmp/naux-coqchk-context.txt
              grep -Fq '* Axioms: <none>' /tmp/naux-coqchk-context.txt
            endGroup

            startGroup "Reject unchecked declarations"
              if grep -R -n -E '\b(Admitted|admit|Axiom|Parameter)\b' \
                --include='*.v' naux-meta-coq; then
                echo "Unchecked formal declaration found" >&2
                exit 1
              fi
            endGroup

            make -C naux-meta-coq clean
      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
