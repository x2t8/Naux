name: S4 measurement evidence law

on:
  push:
    paths:
      - ".github/workflows/s4-measurement-evidence.yml"
      - "distribution/s4-performance/WP7A-*"
      - "scripts/s4_measurement_evidence.py"
      - "scripts/tests/test_s4_measurement_evidence*.py"
  pull_request:
    paths:
      - ".github/workflows/s4-measurement-evidence.yml"
      - "distribution/s4-performance/WP7A-*"
      - "scripts/s4_measurement_evidence.py"
      - "scripts/tests/test_s4_measurement_evidence*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clock-free-evidence-law:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate static WP7A authority
        run: python3 scripts/s4_measurement_evidence.py
      - name: Replay schema and exact arithmetic fixtures
        run: python3 -m unittest scripts.tests.test_s4_measurement_evidence_static scripts.tests.test_s4_measurement_evidence_replay
